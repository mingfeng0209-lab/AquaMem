<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e0f2fe">
  <title>AquaMem · 底片接力・海洋回憶錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@400;500;700;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-sky: #e0f2fe;
      --bg-gradient: linear-gradient(180deg, #dbeafe 0%, #e0f2fe 35%, #ecfeff 70%, #fef3c7 100%);
      --card-bg: #ffffff;
      --border-color: #bae6fd;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --ocean-blue: #0284c7;
      --ocean-soft: #38bdf8;
      --seafoam: #14b8a6;
      --coral-pink: #f43f5e;
      --coral-light: #ffe4e6;
      --sun-yellow: #fbbf24;
      --sand-beige: #fef3c7;
      
      --shadow-soft: 0 4px 14px rgba(14, 165, 233, 0.12);
      --shadow-bubble: 0 8px 20px rgba(2, 132, 199, 0.15);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 60px 14px;
      overflow-x: hidden;
      position: relative;
    }

    /* 可愛泡泡漂浮背景 */
    .bubble-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(56, 189, 248, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }
    .bubble:nth-child(1) { width: 32px; height: 32px; left: 8%; bottom: -40px; animation-duration: 9s; }
    .bubble:nth-child(2) { width: 18px; height: 18px; left: 30%; bottom: -40px; animation-duration: 7s; animation-delay: 2s; }
    .bubble:nth-child(3) { width: 44px; height: 44px; right: 12%; bottom: -50px; animation-duration: 11s; animation-delay: 1s; }
    .bubble:nth-child(4) { width: 22px; height: 22px; right: 28%; bottom: -40px; animation-duration: 8s; animation-delay: 3.5s; }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.9); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1;
      position: relative;
    }

    /* 頂部標題 */
    .cute-header {
      text-align: center;
      padding: 6px 0 2px 0;
    }
    .header-logo-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow-soft);
    }
    .header-logo-row h1 {
      font-size: 1.28rem;
      font-weight: 900;
      color: #0369a1;
      letter-spacing: -0.02em;
    }
    .header-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      color: #0284c7;
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    /* 底片進度卡片 */
    .progress-box {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-soft);
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }
    .progress-labels .highlight {
      color: #e11d48;
      background: #ffe4e6;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.76rem;
    }
    .progress-track {
      width: 100%;
      height: 12px;
      background: #f1f5f9;
      border-radius: var(--radius-pill);
      overflow: hidden;
      border: 1px solid #cbd5e1;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #14b8a6, #fbbf24);
      border-radius: var(--radius-pill);
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 5 人依序接棒輪替卡 */
    .turn-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-soft);
    }
    .turn-header {
      font-size: 0.76rem;
      font-weight: 800;
      color: #0284c7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .members-chain {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .members-chain::-webkit-scrollbar { display: none; }
    
    .member-item {
      flex: 1;
      min-width: 60px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .member-item.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      font-weight: 900;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
    }
    .member-item.active::after {
      content: "📷 掌鏡";
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      background: #f43f5e;
      color: #ffffff;
      font-size: 0.58rem;
      padding: 1px 5px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .chain-arrow {
      color: #94a3b8;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    /* 抽籤大卡片（溫暖明亮、白底圓角可愛風） */
    .draw-card {
      background: #ffffff;
      border: 3px solid #7dd3fc;
      border-radius: var(--radius-lg);
      padding: 22px 18px;
      text-align: center;
      box-shadow: var(--shadow-bubble);
      position: relative;
      overflow: hidden;
    }
    .draw-card::before {
      content: "🫧";
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 1.2rem;
      opacity: 0.8;
    }
    .draw-card::after {
      content: "🐠";
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .stage-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #0284c7;
      background: #e0f2fe;
      padding: 3px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 12px;
    }

    .topic-display {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4px 0;
    }
    .topic-title {
      font-size: 1.95rem;
      font-weight: 900;
      color: #0369a1;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .topic-desc {
      font-size: 0.92rem;
      font-weight: 500;
      color: #64748b;
      line-height: 1.45;
      max-width: 310px;
    }

    /* 動作按鈕群 */
    .action-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-draw-pop {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-draw-pop:active {
      transform: scale(0.97);
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.2);
    }

    /* 按下快門交棒區 */
    .finish-section {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 2px dashed #bae6fd;
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .photographer-confirm-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
    }
    .photographer-confirm-tag strong {
      color: #0284c7;
      font-size: 1.05rem;
      background: #e0f2fe;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .btn-save-shot {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 15px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-save-shot:active {
      transform: scale(0.97);
    }

    /* 可愛手帳底片清單 */
    .history-card {
      background: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-soft);
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .history-btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-small-pill {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #475569;
      border-radius: var(--radius-pill);
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-small-pill:active {
      background: #e2e8f0;
      color: #0f172a;
    }
    .btn-small-pill.danger {
      color: #e11d48;
      border-color: #fecdd3;
    }

    .shots-stream {
      list-style: none;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      max-height: 330px;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: #bae6fd transparent;
    }
    .shots-stream::-webkit-scrollbar { width: 4px; }
    .shots-stream::-webkit-scrollbar-thumb {
      background: #bae6fd;
      border-radius: 4px;
    }

    .shot-row {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s ease;
    }
    .shot-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shot-index {
      font-size: 0.76rem;
      font-weight: 900;
      color: #0284c7;
      background: #e0f2fe;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .shot-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
    }
    .shot-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shot-photographer {
      font-size: 0.75rem;
      font-weight: 700;
      color: #0369a1;
      background: #bae6fd;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }
    .shot-time {
      font-size: 0.7rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .empty-placeholder {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 24px 8px;
      line-height: 1.5;
    }

    /* 可愛彈出視窗 */
    .cute-modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .cute-modal {
      background: #ffffff;
      border: 3px solid #7dd3fc;
      border-radius: var(--radius-lg);
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 16px 30px rgba(0,0,0,0.2);
    }
    .cute-modal h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0369a1;
      margin-bottom: 6px;
    }
    .cute-modal p {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .cute-modal textarea {
      width: 100%;
      border: 2px solid #bae6fd;
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 0.9rem;
      color: #0f172a;
      outline: none;
      margin-bottom: 14px;
      resize: none;
      font-weight: 600;
    }
    .cute-modal textarea:focus {
      border-color: #0284c7;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* 浮動提示 Toast */
    .cute-toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: #ffffff;
      border: 2px solid #0284c7;
      color: #0369a1;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.86rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cute-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 漂浮可愛泡泡 -->
  <div class="bubble-bg">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <div class="app-container">
    <!-- 頂部歡樂標題 -->
    <header class="cute-header">
      <div class="header-logo-row">
        <span>🐬</span>
        <h1>AquaMem</h1>
        <span>📸</span>
      </div>
      <p class="header-subtitle">底片接力・海洋回憶錄 🫧</p>
    </header>

    <!-- 底片進度卡 -->
    <section class="progress-box">
      <div class="progress-labels">
        <span>🎞️ 即可拍進度：<span id="shotProgressText">0 / 25 張</span></span>
        <span class="highlight" id="poolRemainingTag">主題池剩餘 100</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </section>

    <!-- 5 人順序輪替條 (嚴格循環：同事A -> B -> C -> D -> E -> A) -->
    <section class="turn-card">
      <div class="turn-header">
        <span>🐢 5人接棒順序（拍完自動交下一位）</span>
        <span style="font-size: 0.7rem; color: #94a3b8;">可點擊手動換人</span>
      </div>
      <div class="members-chain" id="membersChain">
        <!-- 成員依序排列 -->
      </div>
    </section>

    <!-- 抽選核心舞台 -->
    <section class="draw-card">
      <div class="stage-tag" id="stageTag">🌊 準備好出發了嗎？</div>

      <div class="topic-display">
        <div class="topic-title" id="topicTitle">點擊抽籤 🎲</div>
        <div class="topic-desc" id="topicDesc">從 100 個海洋冒險主題中抽出一張靈感！</div>
      </div>

      <div class="action-col">
        <button class="btn-draw-pop" id="btnDraw" onclick="handleDraw()">
          <span>🎲 抽選下一個主題</span>
        </button>

        <!-- 快門完成交棒按鈕 -->
        <div class="finish-section" id="finishSection">
          <div class="photographer-confirm-tag">
            本張掌鏡：<strong id="activePersonLabel">同事A</strong>
          </div>
          <button class="btn-save-shot" onclick="handleSaveShot()">
            <span>📸 已按快門！交棒下一位 ➔</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 已拍攝完成手帳清單 -->
    <section class="history-card">
      <div class="history-header">
        <div class="history-title">
          <span>📋 已封存的底片清單</span>
        </div>
        <div class="history-btn-group">
          <button class="btn-small-pill" onclick="copyForLine()">複製到 LINE</button>
          <button class="btn-small-pill" onclick="openMemberModal()">編輯名字</button>
          <button class="btn-small-pill danger" onclick="confirmReset()">重置</button>
        </div>
      </div>

      <ul class="shots-stream" id="shotsStream">
        <!-- 動態渲染清單 -->
      </ul>
      <div class="empty-placeholder" id="emptyPlaceholder">
        🐠 尚未按下第一張快門<br>抽籤完成任務後，點擊交棒就會記在這邊囉！
      </div>
    </section>
  </div>

  <!-- 成員設定 Modal -->
  <div class="cute-modal-wrap" id="memberModal">
    <div class="cute-modal">
      <h3>👥 編輯 5 位同行夥伴</h3>
      <p>請輸入大家的名字或綽號（用逗號 , 分開），系統會嚴格照這個順序輪流掌鏡：</p>
      <textarea id="modalMemberInput" rows="3"></textarea>
      <div class="modal-actions">
        <button class="btn-small-pill" onclick="closeMemberModal()">取消</button>
        <button class="btn-small-pill" style="background:#0284c7;color:#fff;border-color:transparent;" onclick="saveMembersFromModal()">儲存順序</button>
      </div>
    </div>
  </div>

  <!-- 可愛 Toast -->
  <div class="cute-toast" id="cuteToast">
    <span id="toastIcon">✨</span>
    <span id="toastText">訊息</span>
  </div>

  <script>
    /* =========================================================
       1. 完整的 100 個原始主題清單（嚴格無機會與命運）
       ========================================================= */
    const THEMES_100 = [
      { id: 1, title: "【藍】", desc: "天空、水、衣物、或冷調氛圍" },
      { id: 2, title: "【防備之外】", desc: "毫無準備、完全沒意識到鏡頭的瞬間" },
      { id: 3, title: "【距離】", desc: "極近的壓迫、極遠的渺小、或彼此間的空白" },
      { id: 4, title: "【線條】", desc: "路面、陰影、電線、或是物體邊緣輪廓" },
      { id: 5, title: "【光】", desc: "逆光、光斑、透光的一角、或明暗交界" },
      { id: 6, title: "【專注】", desc: "眼神或心思完全定在某處的狀態" },
      { id: 7, title: "【圓】", desc: "任何帶有圓形輪廓的物件、斑點或局部" },
      { id: 8, title: "【背影】", desc: "不露臉，單純望向別處的身影" },
      { id: 9, title: "【紅】", desc: "視野裡最顯眼、跳出來的那抹紅" },

    /* =========================================================
       2. LocalStorage 安全讀寫與狀態
       ========================================================= */
    const DEFAULT_MEMBERS = ["同事A", "同事B", "同事C", "同事D", "同事E"];

    function getStorage(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.warn("Storage restricted", e);
      }
    }

    let state = {
      members: getStorage("aquamem_cute_members", DEFAULT_MEMBERS),
      records: getStorage("aquamem_cute_records", []),
      activeIdx: 0,
      currentDrawn: null
    };

    // 依據已拍攝數量，嚴格同步目前的掌鏡者索引 (0->1->2->3->4->0...)
    function syncTurn() {
      if (state.members.length === 0) return;
      state.activeIdx = state.records.length % state.members.length;
    }

    // 計算剩餘主題池（防重複核心：排除所有已記錄的 themeId）
    function getRemainingThemes() {
      const savedIds = new Set(state.records.map(r => r.themeId));
      return THEMES_100.filter(t => !savedIds.has(t.id));
    }

    /* =========================================================
       3. 抽籤動畫與邏輯
       ========================================================= */
    function handleDraw() {
      const remaining = getRemainingThemes();
      if (remaining.length === 0) {
        showToast("🎉 哇！100 個主題已經全數拍完了！", "🏆");
        return;
      }

      const btn = document.getElementById("btnDraw");
      btn.disabled = true;

      const titleEl = document.getElementById("topicTitle");
      const descEl = document.getElementById("topicDesc");
      const stageTag = document.getElementById("stageTag");

      stageTag.innerText = "🫧 命運齒輪轉動中...";

      let counter = 0;
      const timer = setInterval(() => {
        const rand = remaining[Math.floor(Math.random() * remaining.length)];
        titleEl.innerText = rand.title;
        descEl.innerText = rand.desc;
        counter++;

        if (counter > 10) {
          clearInterval(timer);
          const finalPick = remaining[Math.floor(Math.random() * remaining.length)];
          state.currentDrawn = finalPick;

          titleEl.innerText = finalPick.title;
          descEl.innerText = finalPick.desc;
          stageTag.innerText = `🎯 第 ${String(finalPick.id).padStart(2, '0')} 號主題出爐！`;

          btn.disabled = false;
          btn.innerHTML = `<span>🔄 不滿意？換一個</span>`;
          document.getElementById("finishSection").style.display = "flex";
          updateCurrentPhotographerUI();
        }
      }, 55);
    }

    /* =========================================================
       4. 拍照完成確認：自動儲存並嚴格跳下一位
       ========================================================= */
    function handleSaveShot() {
      if (!state.currentDrawn) return;
      if (state.members.length === 0) return;

      const currentPerson = state.members[state.activeIdx];
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newRecord = {
        shotNo: state.records.length + 1,
        themeId: state.currentDrawn.id,
        themeTitle: state.currentDrawn.title,
        photographer: currentPerson,
        time: timeStr
      };

      state.records.push(newRecord);
      setStorage("aquamem_cute_records", state.records);

      // 自動嚴格交棒給下一位 (A -> B -> C -> D -> E -> A)
      syncTurn();
      const nextPerson = state.members[state.activeIdx];

      showToast(`📸 第 ${newRecord.shotNo} 張完成！交棒給 ${nextPerson}`, "🌊");

      // 重設卡片狀態
      state.currentDrawn = null;
      document.getElementById("finishSection").style.display = "none";
      document.getElementById("btnDraw").innerHTML = `<span>🎲 抽選下一個主題</span>`;
      document.getElementById("stageTag").innerText = "🌊 準備好出發了嗎？";
      document.getElementById("topicTitle").innerText = `換 ${nextPerson} 掌鏡囉！`;
      document.getElementById("topicDesc").innerText = "滾輪過片完成後，點擊上方按鈕抽下一個題目 🫧";

      renderAll();
    }

    /* =========================================================
       5. 畫面渲染
       ========================================================= */
    function renderMembersChain() {
      const container = document.getElementById("membersChain");
      container.innerHTML = "";

      state.members.forEach((m, idx) => {
        const item = document.createElement("div");
        item.className = `member-item ${idx === state.activeIdx ? "active" : ""}`;
        item.innerText = m;
        // 允許臨時手動更換當前值星
        item.onclick = () => {
          state.activeIdx = idx;
          updateCurrentPhotographerUI();
          renderMembersChain();
          showToast(`已手動切換值星：${m}`, "👤");
        };
        container.appendChild(item);

        if (idx < state.members.length - 1) {
          const arrow = document.createElement("span");
          arrow.className = "chain-arrow";
          arrow.innerText = "➔";
          container.appendChild(arrow);
        }
      });
    }

    function updateCurrentPhotographerUI() {
      const name = state.members[state.activeIdx] || "未指定";
      document.getElementById("activePersonLabel").innerText = name;
    }

    function renderProgress() {
      const count = state.records.length;
      const target = 25; // 標準即可拍張數
      const percent = Math.min(100, Math.round((count / target) * 100));

      document.getElementById("shotProgressText").innerText = `${count} / ${target} 張`;
      document.getElementById("progressBarFill").style.width = `${percent}%`;

      const remainingThemes = getRemainingThemes();
      document.getElementById("poolRemainingTag").innerText = `主題池剩餘 ${remainingThemes.length}`;
    }

    function renderHistoryList() {
      const stream = document.getElementById("shotsStream");
      const empty = document.getElementById("emptyPlaceholder");
      stream.innerHTML = "";

      if (state.records.length === 0) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      state.records.forEach(r => {
        const li = document.createElement("li");
        li.className = "shot-row";
        li.innerHTML = `
          <div class="shot-left">
            <span class="shot-index">#${String(r.shotNo).padStart(2, '0')}</span>
            <span class="shot-title">${r.themeTitle}</span>
          </div>
          <div class="shot-right">
            <span class="shot-photographer">${r.photographer}</span>
            <span class="shot-time">${r.time}</span>
          </div>
        `;
        stream.appendChild(li);
      });
    }

    function renderAll() {
      renderMembersChain();
      renderProgress();
      renderHistoryList();
      updateCurrentPhotographerUI();
    }

    /* =========================================================
       6. LINE 格式複製 & 成員 Modal & 重設
       ========================================================= */
    function copyForLine() {
      if (state.records.length === 0) {
        showToast("清單目前是空的，還沒有紀錄喔！", "🫧");
        return;
      }

      let text = "🐬【AquaMem · 底片接力清單】📸\n";
      text += `🌊 進度：${state.records.length} / 25 張\n`;
      text += "-------------------------\n";
      state.records.forEach(r => {
        text += `#${String(r.shotNo).padStart(2, '0')} ${r.themeTitle}\n`;
        text += `   👤 掌鏡：${r.photographer}  ⏰ ${r.time}\n`;
      });
      text += "-------------------------\n";
      text += "✨ 來自海生館與公路上的美好片刻 🫧";

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast("已複製清單！可直接貼到 LINE 群組", "📋");
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        showToast("已複製清單！可直接貼到 LINE 群組", "📋");
      } catch (err) {
        showToast("複製失敗，請手動截圖分享", "⚠️");
      }
      document.body.removeChild(ta);
    }

    function openMemberModal() {
      document.getElementById("modalMemberInput").value = state.members.join(", ");
      document.getElementById("memberModal").style.display = "flex";
    }

    function closeMemberModal() {
      document.getElementById("memberModal").style.display = "none";
    }

    function saveMembersFromModal() {
      const val = document.getElementById("modalMemberInput").value;
      const parsed = val.split(/[,，]/).map(s => s.trim()).filter(s => s.length > 0);
      if (parsed.length === 0) {
        showToast("請至少填寫一位夥伴的名字", "⚠️");
        return;
      }
      state.members = parsed;
      setStorage("aquamem_cute_members", state.members);
      syncTurn();
      renderAll();
      closeMemberModal();
      showToast("成員順序已更新！", "✨");
    }

    function confirmReset() {
      if (confirm("確定要重設所有拍攝紀錄嗎？\n100 個主題庫將會全部重置！（無法復原喔）")) {
        state.records = [];
        setStorage("aquamem_cute_records", []);
        syncTurn();
        state.currentDrawn = null;
        document.getElementById("finishSection").style.display = "none";
        document.getElementById("btnDraw").innerHTML = `<span>🎲 抽選下一個主題</span>`;
        document.getElementById("stageTag").innerText = "🌊 準備好出發了嗎？";
        document.getElementById("topicTitle").innerText = "點擊抽籤 🎲";
        document.getElementById("topicDesc").innerText = "從 100 個海洋冒險主題中抽出一張靈感！";
        renderAll();
        showToast("紀錄已重置，開啟全新一卷底片！", "🫧");
      }
    }

    function showToast(msg, icon = "✨") {
      const t = document.getElementById("cuteToast");
      document.getElementById("toastIcon").innerText = icon;
      document.getElementById("toastText").innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }

    // 啟動
    window.addEventListener("DOMContentLoaded", () => {
      syncTurn();
      renderAll();
    });
  </script>
</body>
</html>
